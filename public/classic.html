<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImageStitch — 图片竖向拼接</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
  background: #eef2f7;
  color: #1e293b;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ── */
header {
  padding: 0 24px;
  height: 52px;
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
  box-shadow: 0 1px 4px rgba(37,99,235,0.07);
}
.header-logo {
  display: flex;
  align-items: center;
  gap: 8px;
}
.header-icon {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  box-shadow: 0 2px 6px rgba(37,99,235,0.3);
}
header h1 {
  font-size: 16px; font-weight: 700; color: #1e3a8a; letter-spacing: -0.4px;
}
header .sub {
  font-size: 11.5px; color: #94a3b8;
  padding-left: 14px;
  border-left: 1px solid #e2e8f0;
  margin-left: 2px;
}
.header-spacer { flex: 1; }
.header-badge {
  font-size: 10.5px;
  color: #3b82f6;
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  padding: 3px 9px;
  border-radius: 20px;
  font-weight: 500;
}

/* ── Layout ── */
.app { display: flex; flex: 1; overflow: hidden; position: relative; }

/* ── Sidebar ── */
.sidebar {
  width: 260px;
  min-width: 180px;
  max-width: 480px;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
  position: relative;
}

/* Resize handle */
.sidebar-resizer {
  position: absolute;
  top: 0; right: -4px; bottom: 0;
  width: 8px;
  cursor: col-resize;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
}
.sidebar-resizer::after {
  content: '';
  width: 3px; height: 36px;
  background: #cbd5e1;
  border-radius: 2px;
  transition: background 0.15s, height 0.15s;
}
.sidebar-resizer:hover::after,
.sidebar-resizer.active::after {
  background: #3b82f6;
  height: 56px;
}

/* Upload zone */
.upload-zone {
  margin: 14px 14px 10px;
  border: 2px dashed #bfdbfe;
  border-radius: 12px;
  padding: 22px 14px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
  background: linear-gradient(160deg, #f0f7ff 0%, #f8fafc 100%);
  position: relative;
  overflow: hidden;
}
.upload-zone::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(59,130,246,0.06) 0%, transparent 70%);
  pointer-events: none;
}
.upload-zone:hover, .upload-zone.drag-over {
  border-color: #3b82f6;
  background: linear-gradient(160deg, #dbeafe 0%, #eff6ff 100%);
  box-shadow: 0 0 0 4px rgba(59,130,246,0.08);
}
.upload-zone .uz-icon {
  font-size: 28px;
  margin-bottom: 8px;
  display: block;
  filter: drop-shadow(0 2px 4px rgba(37,99,235,0.15));
}
.upload-zone .uz-label {
  font-size: 13px; font-weight: 600; color: #1e40af; margin-bottom: 4px;
}
.upload-zone .uz-hint {
  font-size: 11px; color: #64748b; line-height: 1.7;
}
.upload-zone .uz-chips {
  display: flex; gap: 4px; justify-content: center; margin-top: 10px; flex-wrap: wrap;
}
.uz-chip {
  font-size: 10px; color: #3b82f6; background: #eff6ff;
  border: 1px solid #bfdbfe; padding: 1px 7px; border-radius: 10px;
}

/* Sidebar section header */
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 14px 4px;
  flex-shrink: 0;
}
.section-title {
  font-size: 10px; font-weight: 700; color: #94a3b8;
  text-transform: uppercase; letter-spacing: 0.7px;
}
.section-count {
  font-size: 10px; color: #3b82f6; background: #eff6ff;
  padding: 1px 7px; border-radius: 10px; font-weight: 600;
}

/* Thumb grid */
.thumb-list {
  flex: 1; overflow-y: auto; padding: 8px 10px 6px;
}
.thumb-list::-webkit-scrollbar { width: 4px; }
.thumb-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

.thumb-grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.thumb-item {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  cursor: grab;
  position: relative;
  border-radius: 8px;
  padding: 0;
  border: 1px solid transparent;
  transition: border-color 0.12s;
}
.thumb-item:hover { border-color: #3b82f6; }
.thumb-item.dragging { opacity: 0.25; }
.thumb-item.drop-before::before {
  content: ''; position: absolute;
  top: -5px; left: 0; right: 0; height: 2px;
  background: #3b82f6; border-radius: 1px;
  box-shadow: 0 0 6px rgba(59,130,246,0.5);
}
.thumb-item.drop-after::after {
  content: ''; position: absolute;
  bottom: -5px; left: 0; right: 0; height: 2px;
  background: #3b82f6; border-radius: 1px;
  box-shadow: 0 0 6px rgba(59,130,246,0.5);
}

.thumb-img-wrap {
  position: relative; width: 100%;
}
.thumb-img {
  width: 100%; height: auto; object-fit: cover;
  border-radius: 7px;
  background: #e2e8f0;
  border: 1px solid #e2e8f0;
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  display: block;
}
.thumb-del {
  position: absolute; top: 5px; right: 5px;
  width: 20px; height: 20px;
  background: rgba(0,0,0,0.5); color: #fff;
  border: none; border-radius: 50%;
  cursor: pointer; font-size: 13px; line-height: 20px;
  text-align: center; padding: 0;
  opacity: 0; transition: opacity 0.15s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.25);
}
.thumb-item:hover .thumb-del { opacity: 1; }
.thumb-del:hover { background: #ef4444; }

.thumb-num {
  font-size: 11px; font-weight: 600; color: #94a3b8;
  line-height: 1; padding-bottom: 1px;
}

/* Clear all button area */
.sidebar-footer {
  padding: 10px 14px 14px;
  flex-shrink: 0;
  border-top: 1px solid #f1f5f9;
}
.btn-clear {
  width: 100%;
  padding: 8px 0;
  border-radius: 8px;
  border: 1px solid #fecaca;
  background: #fff5f5;
  color: #ef4444;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.btn-clear:hover {
  background: #fee2e2;
  border-color: #fca5a5;
  box-shadow: 0 1px 4px rgba(239,68,68,0.12);
}
.btn-clear:active { transform: scale(0.98); }

/* ── Main ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

/* Preview */
.preview-wrap {
  flex: 1; overflow-y: auto;
  background: #eef2f7;
  display: flex; justify-content: center;
  padding: 32px 28px;
}
.preview-wrap::-webkit-scrollbar { width: 6px; }
.preview-wrap::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

.preview-inner {
  width: 100%; max-width: 460px;
}

.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 340px; gap: 12px; text-align: center;
}
.empty-state .es-icon {
  width: 72px; height: 72px; background: #fff;
  border-radius: 18px; display: flex; align-items: center; justify-content: center;
  font-size: 34px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.07);
  border: 1px solid #e2e8f0;
}
.empty-state h3 { font-size: 15px; font-weight: 600; color: #334155; }
.empty-state p { font-size: 12.5px; color: #64748b; line-height: 1.6; max-width: 240px; }
.empty-state .es-formats {
  display: flex; gap: 5px; margin-top: 2px;
}
.es-fmt {
  font-size: 10.5px; color: #94a3b8; background: #f8fafc;
  border: 1px solid #e2e8f0; padding: 2px 8px; border-radius: 8px;
}

/* Image blocks */
.img-block {
  position: relative; width: 100%; overflow: hidden;
  user-select: none;
  border-radius: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.img-block:first-child { border-radius: 8px 8px 0 0; }
.img-block:last-child  { border-radius: 0 0 8px 8px; }
.img-block:only-child  { border-radius: 8px; }
.img-block img {
  position: absolute; pointer-events: none; display: block;
}

/* Crop handles */
.h-top, .h-bottom, .h-left, .h-right {
  position: absolute; z-index: 10;
  opacity: 0; transition: opacity 0.15s;
}
.img-block:hover .h-top,
.img-block:hover .h-bottom,
.img-block:hover .h-left,
.img-block:hover .h-right { opacity: 1; }

.h-top, .h-bottom {
  left: 0; right: 0; height: 10px;
  cursor: ns-resize;
  background: rgba(37,99,235,0.5);
  display: flex; align-items: center; justify-content: center;
}
.h-top { top: 0; }
.h-bottom { bottom: 0; }
.h-top:hover, .h-bottom:hover { background: rgba(37,99,235,0.82); height: 12px; opacity: 1; }
.h-top::after, .h-bottom::after {
  content: ''; width: 30px; height: 3px;
  background: rgba(255,255,255,0.92); border-radius: 2px;
}

.h-left, .h-right {
  top: 0; bottom: 0; width: 10px;
  cursor: ew-resize;
  background: rgba(37,99,235,0.5);
  display: flex; align-items: center; justify-content: center;
}
.h-left { left: 0; }
.h-right { right: 0; }
.h-left:hover, .h-right:hover { background: rgba(37,99,235,0.82); width: 12px; opacity: 1; }
.h-left::after, .h-right::after {
  content: ''; width: 3px; height: 30px;
  background: rgba(255,255,255,0.92); border-radius: 2px;
}

.img-block:hover {
  outline: 2px solid rgba(59,130,246,0.4);
  outline-offset: 0px;
  z-index: 1;
}

/* Badge */
.img-badge {
  position: absolute; top: 12px; right: 12px;
  background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
  color: rgba(255,255,255,0.95); font-size: 10px;
  padding: 2px 7px; border-radius: 5px;
  pointer-events: none; z-index: 20;
  opacity: 0; transition: opacity 0.15s; white-space: nowrap;
}
.img-block:hover .img-badge { opacity: 1; }

.reset-hint {
  position: absolute; bottom: 13px; left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
  color: #fff; font-size: 10px;
  padding: 3px 9px; border-radius: 5px;
  white-space: nowrap; pointer-events: none;
  opacity: 0; transition: opacity 0.15s; z-index: 20;
}
.img-block:hover .reset-hint { opacity: 1; }

/* Separator */
.img-sep { height: 1px; background: rgba(226,232,240,0.8); width: 100%; }

/* ── Action bar ── */
.action-bar {
  padding: 11px 20px;
  background: #fff;
  border-top: 1px solid #e2e8f0;
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
  box-shadow: 0 -1px 4px rgba(0,0,0,0.04);
}

.width-ctrl {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: #64748b;
}
.width-ctrl label { white-space: nowrap; font-weight: 500; }
.width-ctrl input {
  width: 68px; background: #f8fafc;
  border: 1px solid #e2e8f0; color: #1e293b;
  padding: 5px 8px; border-radius: 6px; font-size: 12px;
}
.width-ctrl input:focus { outline: none; border-color: #3b82f6; background: #fff; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }

.bar-divider { width: 1px; height: 22px; background: #e2e8f0; margin: 0 2px; }

.btn {
  padding: 7px 18px; border-radius: 8px; border: none;
  cursor: pointer; font-size: 13px; font-weight: 500;
  transition: all 0.15s; white-space: nowrap;
}
.btn:disabled { opacity: 0.38; cursor: not-allowed; }
.btn-primary {
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  color: #fff;
  box-shadow: 0 2px 6px rgba(37,99,235,0.28);
}
.btn-primary:not(:disabled):hover {
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  box-shadow: 0 3px 10px rgba(37,99,235,0.38);
  transform: translateY(-1px);
}
.btn-primary:not(:disabled):active { transform: translateY(0); }
.btn-secondary {
  background: #f8fafc; color: #475569;
  border: 1px solid #e2e8f0;
}
.btn-secondary:not(:disabled):hover {
  background: #f1f5f9; border-color: #cbd5e1;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}

.status-msg { font-size: 11.5px; color: #94a3b8; margin-left: auto; transition: color 0.2s; }
.status-msg.ok { color: #16a34a; }
.status-msg.err { color: #dc2626; }

/* Toast */
.toast {
  position: fixed; bottom: 72px; left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: #1e293b; color: #f1f5f9;
  padding: 9px 18px; border-radius: 10px; font-size: 13px;
  opacity: 0; transition: all 0.22s; pointer-events: none;
  z-index: 100; white-space: nowrap;
  box-shadow: 0 6px 20px rgba(0,0,0,0.18);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="header-logo">
    <div class="header-icon">🔗</div>
    <h1>ImageStitch</h1>
  </div>
  <span class="sub">竖向拼接 · 四边裁切 · 拖拽排序</span>
  <div class="header-spacer"></div>
  <span class="header-badge">纯本地处理，不上传图片</span>
</header>

<div class="app">

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="upload-zone" id="uploadZone">
      <span class="uz-icon">📷</span>
      <div class="uz-label">点击选择 / 拖入图片</div>
      <div class="uz-hint">或直接 Ctrl+V 粘贴截图<br>最多添加 15 张</div>
      <div class="uz-chips">
        <span class="uz-chip">JPG</span>
        <span class="uz-chip">PNG</span>
        <span class="uz-chip">WebP</span>
        <span class="uz-chip">GIF</span>
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
    </div>

    <div class="section-header" id="sectionHeader" style="display:none">
      <span class="section-title">图片列表</span>
      <span class="section-count" id="sectionCount">0</span>
    </div>
    <div class="thumb-list" id="thumbList"></div>

    <div class="sidebar-footer" id="sidebarFooter" style="display:none">
      <button class="btn-clear" id="btnClear">
        <span>🗑</span> 一键清空
      </button>
    </div>

    <div class="sidebar-resizer" id="sidebarResizer"></div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="preview-wrap" id="previewWrap">
      <div class="preview-inner" id="previewInner">
        <div class="empty-state" id="emptyState">
          <div class="es-icon">🖼️</div>
          <h3>添加图片开始拼接</h3>
          <p>在左侧上传 2–15 张图片，支持拖拽调序、四边裁切</p>
          <div class="es-formats">
            <span class="es-fmt">JPG</span>
            <span class="es-fmt">PNG</span>
            <span class="es-fmt">WebP</span>
            <span class="es-fmt">GIF</span>
          </div>
        </div>
      </div>
    </div>

    <div class="action-bar">
      <div class="width-ctrl">
        <label for="outWidth">输出宽度</label>
        <input type="number" id="outWidth" value="" placeholder="自动" min="100" max="8192" step="10">
        <span>px</span>
      </div>
      <div class="bar-divider"></div>
      <button class="btn btn-secondary" id="btnCopy" disabled>复制图片</button>
      <button class="btn btn-primary" id="btnDownload" disabled>↓ 下载 PNG</button>
      <span class="status-msg" id="statusMsg"></span>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>
<canvas id="offscreen" style="display:none"></canvas>

<script>
'use strict';

let images = [];
let idSeq = 0;
let dragSrc = null;

const MAX = 15;
const MIN_VIS = 0.05;

const uploadZone    = document.getElementById('uploadZone');
const fileInput     = document.getElementById('fileInput');
const thumbList     = document.getElementById('thumbList');
const sectionHeader = document.getElementById('sectionHeader');
const sectionCount  = document.getElementById('sectionCount');
const sidebarFooter = document.getElementById('sidebarFooter');
const previewInner  = document.getElementById('previewInner');
const emptyState    = document.getElementById('emptyState');
const btnDownload   = document.getElementById('btnDownload');
const btnCopy       = document.getElementById('btnCopy');
const btnClear      = document.getElementById('btnClear');
const outWidthEl    = document.getElementById('outWidth');
const offscreen     = document.getElementById('offscreen');
const statusMsg     = document.getElementById('statusMsg');
const toastEl       = document.getElementById('toast');

/* ── Sidebar resize ── */
const sidebar = document.getElementById('sidebar');
const resizer = document.getElementById('sidebarResizer');
resizer.addEventListener('mousedown', e => {
  e.preventDefault();
  resizer.classList.add('active');
  const startX = e.clientX;
  const startW = sidebar.offsetWidth;
  const onMove = e => {
    const w = Math.max(180, Math.min(480, startW + e.clientX - startX));
    sidebar.style.width = w + 'px';
  };
  const onUp = () => {
    resizer.classList.remove('active');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  };
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});

/* ── Upload ── */
uploadZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { addFiles(Array.from(e.target.files)); fileInput.value = ''; });
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', e => { if (!uploadZone.contains(e.relatedTarget)) uploadZone.classList.remove('drag-over'); });
uploadZone.addEventListener('drop', e => {
  e.preventDefault(); uploadZone.classList.remove('drag-over');
  addFiles(Array.from(e.dataTransfer.files));
});

document.getElementById('previewWrap').addEventListener('dragover', e => {
  if (e.dataTransfer.types.includes('Files')) e.preventDefault();
});
document.getElementById('previewWrap').addEventListener('drop', e => {
  e.preventDefault(); addFiles(Array.from(e.dataTransfer.files));
});

/* ── Paste ── */
document.addEventListener('paste', e => {
  const items = Array.from(e.clipboardData.items).filter(i => i.type.startsWith('image/'));
  if (!items.length) return;
  e.preventDefault();
  items.forEach((item, n) => {
    const blob = item.getAsFile();
    if (blob) loadBlob(blob, n === 0 ? '粘贴图片' : `粘贴图片 ${n + 1}`);
  });
});

/* ── Clear all ── */
btnClear.addEventListener('click', () => {
  if (!images.length) return;
  images = [];
  render();
  showToast('已清空所有图片');
});

/* ── Add / load ── */
function addFiles(files) {
  const imgs = files.filter(f => f.type.startsWith('image/'));
  const slots = MAX - images.length;
  imgs.slice(0, slots).forEach(f => loadBlob(f, f.name));
  if (imgs.length > slots) showToast(`最多 ${MAX} 张，已忽略 ${imgs.length - slots} 张`);
}

function loadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    images.push({ id: ++idSeq, img, name: cleanName(name), cT: 0, cB: 0, cL: 0, cR: 0 });
    render();
  };
  img.onerror = () => showToast('图片加载失败');
  img.src = url;
}

function cleanName(n) { return n.replace(/\.[^.]+$/, '').slice(0, 28) || '图片'; }
function removeImage(idx) { images.splice(idx, 1); render(); }

/* ── Render ── */
function render() {
  const has = images.length > 0;
  emptyState.style.display = has ? 'none' : '';
  sectionHeader.style.display = has ? '' : 'none';
  sidebarFooter.style.display = has ? '' : 'none';
  sectionCount.textContent = images.length;
  btnDownload.disabled = images.length < 2;
  btnCopy.disabled = images.length < 2;
  renderThumbs();
  renderPreview();
}

/* ── Thumbnails ── */
function renderThumbs() {
  thumbList.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'thumb-grid';

  images.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'thumb-item';
    el.draggable = true;
    el.innerHTML = `
      <div class="thumb-img-wrap">
        <img class="thumb-img" src="${item.img.src}" alt="">
        <button class="thumb-del" title="删除">×</button>
      </div>
      <span class="thumb-num">${i + 1}</span>
    `;
    el.querySelector('.thumb-del').addEventListener('click', e => { e.stopPropagation(); removeImage(i); });

    el.addEventListener('dragstart', e => { dragSrc = i; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    el.addEventListener('dragend', () => { dragSrc = null; el.classList.remove('dragging'); clearDropMarkers(); });
    el.addEventListener('dragover', e => {
      e.preventDefault();
      if (dragSrc === null || dragSrc === i) return;
      clearDropMarkers();
      const mid = el.getBoundingClientRect().left + el.offsetWidth / 2;
      el.classList.add(e.clientX < mid ? 'drop-before' : 'drop-after');
    });
    el.addEventListener('dragleave', () => clearDropMarkers());
    el.addEventListener('drop', e => {
      e.preventDefault();
      if (dragSrc === null || dragSrc === i) return;
      const mid = el.getBoundingClientRect().left + el.offsetWidth / 2;
      let target = e.clientX < mid ? i : i + 1;
      const moved = images.splice(dragSrc, 1)[0];
      if (dragSrc < target) target--;
      images.splice(target, 0, moved);
      dragSrc = null; clearDropMarkers(); render();
    });

    grid.appendChild(el);
  });

  thumbList.appendChild(grid);
}

function clearDropMarkers() {
  thumbList.querySelectorAll('.thumb-item').forEach(el => el.classList.remove('drop-before', 'drop-after'));
}

/* ── Preview ── */
function renderPreview() {
  Array.from(previewInner.children).forEach(el => { if (el !== emptyState) el.remove(); });
  if (!images.length) return;
  const cw = previewInner.clientWidth || 420;
  images.forEach((item, i) => {
    if (i > 0) {
      const sep = document.createElement('div');
      sep.className = 'img-sep';
      previewInner.appendChild(sep);
    }
    previewInner.appendChild(makeBlock(item, i, cw));
  });
}

function geom(item, cw) {
  const nw = item.img.naturalWidth, nh = item.img.naturalHeight;
  const visW = nw * (1 - item.cL - item.cR);
  const visH = nh * (1 - item.cT - item.cB);
  const s = cw / visW;
  return {
    fullW: nw * s, fullH: nh * s,
    visDispH: visH * s,
    offL: item.cL * nw * s,
    offT: item.cT * nh * s,
  };
}

function makeBlock(item, idx, cw) {
  const block = document.createElement('div');
  block.className = 'img-block';
  // corner radius handled via CSS :first-child / :last-child

  const imgEl = document.createElement('img');
  imgEl.src = item.img.src;
  imgEl.draggable = false;
  block.appendChild(imgEl);

  const badge = document.createElement('div');
  badge.className = 'img-badge';
  block.appendChild(badge);

  const hint = document.createElement('div');
  hint.className = 'reset-hint';
  hint.textContent = '双击边框可重置该侧裁切';
  block.appendChild(hint);

  const hTop = mkH('h-top'), hBottom = mkH('h-bottom');
  const hLeft = mkH('h-left'), hRight = mkH('h-right');
  block.append(hTop, hBottom, hLeft, hRight);

  applyGeom(block, imgEl, badge, item, cw);

  hTop.addEventListener('dblclick',    e => { e.preventDefault(); item.cT = 0; applyGeom(block, imgEl, badge, item, cw); });
  hBottom.addEventListener('dblclick', e => { e.preventDefault(); item.cB = 0; applyGeom(block, imgEl, badge, item, cw); });
  hLeft.addEventListener('dblclick',   e => { e.preventDefault(); item.cL = 0; applyGeom(block, imgEl, badge, item, cw); });
  hRight.addEventListener('dblclick',  e => { e.preventDefault(); item.cR = 0; applyGeom(block, imgEl, badge, item, cw); });

  attachDrag(hTop,    'top',    item, block, imgEl, badge, cw);
  attachDrag(hBottom, 'bottom', item, block, imgEl, badge, cw);
  attachDrag(hLeft,   'left',   item, block, imgEl, badge, cw);
  attachDrag(hRight,  'right',  item, block, imgEl, badge, cw);

  return block;
}

function mkH(cls) { const d = document.createElement('div'); d.className = cls; return d; }

function applyGeom(block, imgEl, badge, item, cw) {
  const g = geom(item, cw);
  block.style.height = g.visDispH + 'px';
  imgEl.style.width  = g.fullW + 'px';
  imgEl.style.height = g.fullH + 'px';
  imgEl.style.left   = -g.offL + 'px';
  imgEl.style.top    = -g.offT + 'px';
  const wP = Math.round((1 - item.cL - item.cR) * 100);
  const hP = Math.round((1 - item.cT - item.cB) * 100);
  badge.textContent = (wP < 100 || hP < 100) ? `${wP}% × ${hP}%` : '原始尺寸';
}

function attachDrag(handle, edge, item, block, imgEl, badge, cw) {
  const isV = edge === 'top' || edge === 'bottom';

  const startDrag = (clientX, clientY) => {
    const g = geom(item, cw);
    const refDim = isV ? g.fullH : g.fullW;
    const sc = { top: item.cT, bottom: item.cB, left: item.cL, right: item.cR };

    return (cx, cy) => {
      const delta = isV ? (cy - clientY) : (cx - clientX);
      const frac = delta / refDim;
      if (edge === 'top')    item.cT = clamp(sc.top    + frac, 0, 1 - sc.bottom - MIN_VIS);
      if (edge === 'bottom') item.cB = clamp(sc.bottom - frac, 0, 1 - sc.top    - MIN_VIS);
      if (edge === 'left')   item.cL = clamp(sc.left   + frac, 0, 1 - sc.right  - MIN_VIS);
      if (edge === 'right')  item.cR = clamp(sc.right  - frac, 0, 1 - sc.left   - MIN_VIS);
      applyGeom(block, imgEl, badge, item, cw);
    };
  };

  handle.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    const onMove = startDrag(e.clientX, e.clientY);
    const mm = e => onMove(e.clientX, e.clientY);
    const mu = () => { document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); };
    document.addEventListener('mousemove', mm);
    document.addEventListener('mouseup', mu);
  });

  handle.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    const onMove = startDrag(t.clientX, t.clientY);
    const tm = e => { const t = e.touches[0]; onMove(t.clientX, t.clientY); };
    const te = () => { document.removeEventListener('touchmove', tm); document.removeEventListener('touchend', te); };
    document.addEventListener('touchmove', tm, { passive: false });
    document.addEventListener('touchend', te);
  }, { passive: false });
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

/* ── Resize ── */
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (images.length) renderPreview(); }, 120);
});

/* ── Canvas ── */
function buildCanvas() {
  const userW = parseInt(outWidthEl.value);
  const autoW = images.reduce((mx, item) => Math.max(mx, item.img.naturalWidth), 0);
  const outW = (userW > 0 && userW <= 8192) ? userW : autoW;
  let totalH = 0;
  const draws = images.map(item => {
    const nw = item.img.naturalWidth, nh = item.img.naturalHeight;
    const srcX = Math.round(nw * item.cL), srcY = Math.round(nh * item.cT);
    const srcW = Math.round(nw * (1 - item.cL - item.cR));
    const srcH = Math.round(nh * (1 - item.cT - item.cB));
    const dstH = Math.round(srcH * outW / srcW);
    totalH += dstH;
    return { item, srcX, srcY, srcW, srcH, dstH };
  });
  offscreen.width = outW; offscreen.height = totalH;
  const ctx = offscreen.getContext('2d');
  ctx.clearRect(0, 0, outW, totalH);
  let y = 0;
  draws.forEach(({ item, srcX, srcY, srcW, srcH, dstH }) => {
    ctx.drawImage(item.img, srcX, srcY, srcW, srcH, 0, y, outW, dstH);
    y += dstH;
  });
  return offscreen;
}

/* ── Download ── */
btnDownload.addEventListener('click', () => {
  if (images.length < 2) return;
  setStatus('生成中…', '');
  requestAnimationFrame(() => {
    try {
      buildCanvas();
      offscreen.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'stitched_' + Date.now() + '.png'; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        setStatus('下载完成 ✓', 'ok'); clearStatusLater();
      }, 'image/png');
    } catch (err) { setStatus('错误：' + err.message, 'err'); }
  });
});

/* ── Copy ── */
btnCopy.addEventListener('click', async () => {
  if (images.length < 2) return;
  setStatus('复制中…', '');
  try {
    buildCanvas();
    offscreen.toBlob(async blob => {
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        setStatus('已复制到剪贴板 ✓', 'ok');
        showToast('图片已复制到剪贴板');
        clearStatusLater();
      } catch {
        setStatus('复制失败，请使用下载', 'err'); clearStatusLater(5000);
      }
    }, 'image/png');
  } catch (err) { setStatus('错误：' + err.message, 'err'); }
});

/* ── Status / Toast ── */
let statusTimer;
function setStatus(msg, cls) {
  statusMsg.textContent = msg;
  statusMsg.className = 'status-msg' + (cls ? ' ' + cls : '');
}
function clearStatusLater(ms = 3500) {
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => setStatus('', ''), ms);
}
let toastTimer;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
